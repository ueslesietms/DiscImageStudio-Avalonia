name: avalonia-release

# 手动构建 Avalonia 桌面版并附带到一个 GitHub Release。
# Linux 在 ubuntu 上发布 net10.0，Windows 在 windows-latest 上发布 net10.0-windows（含 IMAPI 刻录）。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '目标 Release 标签，例如 v1.5.0-avalonia.1（已存在或不存在都可以）'
        required: true
        default: 'v1.5.0-avalonia.1'
      prerelease:
        description: '标记为预发布'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish linux-x64
        run: >
          dotnet publish src/DiscImageStudio.Desktop
          -c Release -f net10.0 -r linux-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none -o out/linux-x64

      - name: Package
        run: |
          mkdir -p dist
          tar -czf dist/DiscImageStudio-Avalonia-linux-x64.tar.gz -C out/linux-x64 .

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist/DiscImageStudio-Avalonia-linux-x64.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish win-x64
        shell: pwsh
        run: >
          dotnet publish src/DiscImageStudio.Desktop
          -c Release -f net10.0-windows -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none -o out/win-x64

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path out/win-x64/* -DestinationPath dist/DiscImageStudio-Avalonia-win-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: dist/DiscImageStudio-Avalonia-win-x64.zip

  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Avalonia 桌面版 ${{ inputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: false
          files: |
            dist/DiscImageStudio-Avalonia-linux-x64.tar.gz
            dist/DiscImageStudio-Avalonia-win-x64.zip
